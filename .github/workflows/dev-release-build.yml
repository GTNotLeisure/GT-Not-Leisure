name: Dev Release build

on:
  push:
    branches: [ master, main, release/**, dev-* ]
  pull_request:
    branches: [ master, main, release/**, dev-* ]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('dev-release-build-pr-{0}', github.event.pull_request.number) || format('dev-release-build-{0}', github.ref_name) }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  dev-build:
    runs-on: ubuntu-24.04

    env:
      SOURCE_REF: ${{ github.head_ref || github.ref_name }}
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      SNAPSHOT: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[snapshot]')) || endsWith(github.event_name == 'pull_request' && github.head_ref || github.ref_name, '-snapshot') }}
      MAVEN_PUBLISHING_URL: ${{ vars.MAVEN_PUBLISHING_URL || 'https://nexus.gtnewhorizons.com/repository/releases/' }}

    steps:
      - name: Checkout mod repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK versions
        uses: actions/setup-java@v4
        with:
          java-version: |
            8
            17
            21
            25
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: https://gradle.com/terms-of-service
          build-scan-terms-of-use-agree: yes
          validate-wrappers: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set artifact version
        id: version
        run: python3 .github/scripts/dev_build_identity.py identity

      - name: Setup the workspace
        run: ./gradlew --build-cache --info --stacktrace setupCIWorkspace

      - name: Build the mod
        run: ./gradlew --build-cache --info --stacktrace assemble

      - name: Check build identity and update channels
        run: |
          python3 .github/scripts/test_dev_build_identity.py
          python3 .github/scripts/test_update_channels.py

      - name: Prepare release assets
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python3 .github/scripts/dev_build_identity.py assets

      - name: Upload build artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dev-build-${{ github.event.pull_request.number }}-${{ steps.version.outputs.commit_short }}
          path: build/libs/*.jar
          if-no-files-found: error
          overwrite: true

      - name: Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: Dev Build
          body: |
            Dynamic action build of branch ${{ github.ref_name }}.
            Commit: `${{ steps.version.outputs.commit_short }}`
          tag_name: dev-build
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            build/release-assets/*.jar
            build/release-assets/gtnl-update-*.json

      - name: Remove previous release builds
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_list=$(mktemp)
          trap 'rm -f "$asset_list"' EXIT
          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/dev-build" --jq '.id')
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --jq '.[] | [.id, .name] | @tsv' > "$asset_list"
          while IFS=$'\t' read -r asset_id asset_name; do
            [[ "$asset_name" == *.jar ]] || continue
            if grep -Fqx -- "$asset_name" build/release-assets/asset-names.txt; then
              continue
            fi

            legacy_base=${asset_name%.jar}
            while [[ "$legacy_base" =~ ^(.*)-[[:xdigit:]]{7,40}$ ]]; do
              legacy_base=${BASH_REMATCH[1]}
            done
            same_branch_asset=false
            if [[ "$asset_name" == *-"$BRANCH_KEY"-*.jar ]] \
              || [[ "$asset_name" == *-"$BRANCH_KEY".jar ]]; then
              same_branch_asset=true
            fi

            if [[ "$same_branch_asset" == true ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            fi
          done < "$asset_list"
